{{- $ctx := . -}}
<aside class="docs-nav" id="docs-nav" aria-label="Documentation">
  <div class="docs-nav-in">
    <div id="pagefindsearch" class="docs-search"></div>
    <script>
      window.addEventListener('DOMContentLoaded', () => {
        if (!window.PagefindUI) return;
        new PagefindUI({ element: "#pagefindsearch",
                         baseUrl: "{{ .Site.BaseURL | relURL }}/",
                         showSubResults: true,
                         showImages: false });
      });
    </script>
    {{- range .Site.Menus.sidebar }}
    {{- if .HasChildren }}
    <h2 class="docs-nav-h">{{ .Title | safeHTML }}</h2>
    <ul>
      {{- range .Children }}
      {{- $href := relref $ctx .KeyName }}
      <li><a href="{{ $href }}"{{ if eq $href $ctx.RelPermalink }} aria-current="page"{{ end }}>{{ .Title | safeHTML }}</a></li>
      {{- end }}
    </ul>
    {{- end }}
    {{- end }}
  </div>
</aside>
